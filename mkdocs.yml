site_name: "Maths, CS & AI Compendium"
site_url: "https://henryndubuaku.github.io/maths-cs-ai-compendium/"
site_description: "An open, intuition-first textbook covering mathematics, computer science, and artificial intelligence from the ground up."
site_author: "Henry Ndubuaku"
repo_url: "https://github.com/HenryNdubuaku/maths-cs-ai-compendium"
repo_name: "HenryNdubuaku/maths-cs-ai-compendium"

docs_dir: .

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: slate
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/pyodide-runner.js

extra_css:
  - stylesheets/pyodide-runner.css

plugins:
  - search
  - social

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HenryNdubuaku/maths-cs-ai-compendium

